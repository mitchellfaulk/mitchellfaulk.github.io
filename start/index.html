<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>/TITLE_HERE</title>
  <link rel="stylesheet" href="../assets/css/terminal.css" />
</head>
<body>
  <main class="terminal" id="terminal">
    <div id="history"></div>

    <div id="promptWrapper" class="prompt-wrapper hidden">
      <div class="prompt-line">
        <span class="prompt muted">input:</span>
        <input
          id="cmd"
          class="cmd-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Terminal command input"
        />
        <span class="cursor" aria-hidden="true"></span>
      </div>
    </div>
  </main>

  <script src="../assets/js/terminal-core.js" data-config="../data/start.json"></script>
</body>
</html>
