<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>/start</title>
  <style>
    :root {
      --bg: #050505;
      --fg: #f5f5f5;
      --muted: #bdbdbd;
      --dim: #8b8b8b;
    }

    html, body { height: 100%; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.45;
    }

    /* Full-width terminal buffer (no centering/max-width) */
    .terminal {
      width: 100%;
      margin: 0;
      padding: 18px 14px 64px; /* small breathing room like a real terminal */
      white-space: pre-wrap;
    }

    .muted { color: var(--muted); }
    .dim { color: var(--dim); }

    /* Prompt line: avoid flex gap so the fake cursor sits flush */
    .prompt-line {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0;
    }

    .prompt {
      color: var(--muted);
      margin-right: 6px;
    }

    .cmd-input {
      background: transparent;
      border: none;
      color: var(--fg);
      font: inherit;
      outline: none;
      padding: 0;
      margin: 0;
      min-width: 10ch;
      caret-color: transparent; /* hide native caret */
    }

    .cursor {
      display: inline-block;
      width: 0.6ch;
      height: 1.15em;
      background: var(--fg);
      vertical-align: -0.18em;
      margin-left: 0;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .history-line { white-space: pre-wrap; }

    /* Hide prompt until boot completes */
    .prompt-wrapper.hidden { display: none; }
  </style>
</head>
<body>
  <main class="terminal" id="terminal">
    <div id="history"></div>

    <div id="promptWrapper" class="prompt-wrapper hidden">
      <div class="prompt-line">
        <span class="prompt">guest@nocturne:~$</span>
        <input
          id="cmd"
          class="cmd-input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          aria-label="Terminal command input"
        />
        <span class="cursor" aria-hidden="true"></span>
      </div>
    </div>
  </main>

  <script>
    // =============================
    // CONFIG (change per page)
    // =============================
    const CURRENT_ENDPOINT = "start";
    const EXPECTED_ENDPOINT = "cache"; // next endpoint answer
    const ACCEPT_ALIASES = new Set([EXPECTED_ENDPOINT]);

    // Success handoff pacing
    const NAV_DELAY_SEC = 4;

    // Typewriter settings
    const TYPE_SPEED_MS = 18;         // per character
    const TYPE_LINE_PAUSE_MS = 120;   // between lines
    const BOOT_PAUSE_MS = 220;        // small dramatic pauses

    // Payload text lives here so you can edit one place.
    const PAYLOAD_TEXT = `00001 : 01001
00010 : 01110
00011 : 00100
00100 : 00101
00101 : 11000

.

00001 : 00111
00010 : 01001
00011 : 10100

.

00001 : 01001
00010 : 01111

/

00001 : 10011
00010 : 10100
00011 : 00001
00100 : 10010
00101 : 10100`;

    // Boot / preface lines. First entry can be a function that returns HTML.
    const BOOT_LINES = [
      () => `<span class="muted">node:</span> /${CURRENT_ENDPOINT} <span class="dim">// address chain</span>`,
      "",
      "[init] terminal online",
      "[net ] route table sync: degraded",
      "[err ] payload integrity failure",
      "[dbg ] dumping fragments...",
      "",
      "[dbg ] allocating buffer...",
      "[dbg ] computing payload...",
      "",
      "[payload] index:value",
      ""
    ];

    // =============================
    // DOM
    // =============================
    const historyEl = document.getElementById("history");
    const promptWrapper = document.getElementById("promptWrapper");
    const inputEl = document.getElementById("cmd");

    // =============================
    // Helpers
    // =============================
    function sleep(ms) {
      return new Promise((res) => setTimeout(res, ms));
    }

    function appendLineElement() {
      const div = document.createElement("div");
      div.className = "history-line";
      div.textContent = "";
      historyEl.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    function addHistoryInstant(text) {
      const div = document.createElement("div");
      div.className = "history-line";
      div.textContent = text;
      historyEl.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }

    async function addHistoryTyped(text) {
      const div = appendLineElement();
      for (let i = 0; i < text.length; i++) {
        div.textContent += text[i];
        if (i % 8 === 0) window.scrollTo(0, document.body.scrollHeight);
        await sleep(TYPE_SPEED_MS);
      }
      return div;
    }

    function htmlToPlain(html) {
      const tmp = document.createElement("span");
      tmp.innerHTML = html;
      const plain = (tmp.textContent || "").trim();
      tmp.remove();
      return plain;
    }

    async function addHistoryTypedHTML(html) {
      const plain = htmlToPlain(html);
      const div = appendLineElement();
      for (let i = 0; i < plain.length; i++) {
        div.textContent += plain[i];
        if (i % 8 === 0) window.scrollTo(0, document.body.scrollHeight);
        await sleep(TYPE_SPEED_MS);
      }
      div.innerHTML = html;
      return div;
    }

    async function typeLines(lines) {
      for (const line of lines) {
        if (typeof line === "function") {
          await addHistoryTypedHTML(line());
        } else if (line === "") {
          addHistoryInstant("");
        } else {
          await addHistoryTyped(line);
        }
        await sleep(TYPE_LINE_PAUSE_MS);
      }
    }

    function normalizeEndpoint(raw) {
      if (!raw) return "";
      let s = raw.trim().toLowerCase();

      if (s.startsWith("https://")) s = s.slice(8);
      else if (s.startsWith("http://")) s = s.slice(7);

      // If it looks like a domain, strip everything up to the first slash.
      if (s.indexOf(".") !== -1) {
        const idx = s.indexOf("/");
        if (idx !== -1) s = s.slice(idx + 1);
      }

      while (s.startsWith("/")) s = s.slice(1);
      s = s.split(" ").join("");
      while (s.endsWith("/")) s = s.slice(0, -1);

      return s;
    }

    function isCorrect(endpoint) {
      return ACCEPT_ALIASES.has(endpoint);
    }

    function lockInput() {
      inputEl.disabled = true;
      inputEl.blur();
    }

    function unlockInput() {
      inputEl.disabled = false;
      promptWrapper.classList.remove("hidden");
      inputEl.value = "";
      inputEl.focus();
    }

    async function navigateWithTypedCountdown(endpoint) {
      await typeLines([
        "[ok  ] route accepted",
        "[note] log endpoint: /" + endpoint,
        "[note] recommended: record this node before the merge phase"
      ]);

      let remaining = NAV_DELAY_SEC;
      const countdownLine = addHistoryInstant("[sys ] switching to /" + endpoint + " in " + remaining + "s...");

      const timer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(timer);
          countdownLine.textContent = "[sys ] transferring control -> /" + endpoint;
          window.location.href = "./" + endpoint + "/";
          return;
        }
        countdownLine.textContent = "[sys ] switching to /" + endpoint + " in " + remaining + "s...";
      }, 1000);
    }

    // =============================
    // Boot sequence
    // =============================
    async function runBoot() {
      await sleep(BOOT_PAUSE_MS);
      await typeLines(BOOT_LINES);

      // Pause while "computing payload"
      await sleep(BOOT_PAUSE_MS * 2);

      // Type payload line-by-line
      const lf = String.fromCharCode(10);
      const payloadLines = PAYLOAD_TEXT.split(lf);

      for (const pl of payloadLines) {
        if (pl === "") {
          addHistoryInstant("");
        } else {
          await addHistoryTyped(pl);
        }
        await sleep(TYPE_LINE_PAUSE_MS);
      }

      addHistoryInstant("");
      await addHistoryTyped("[dbg ] input unlocked");
      addHistoryInstant("");
      await addHistoryTyped("type the next endpoint");
      addHistoryInstant("");

      unlockInput();
    }

    // =============================
    // Input handling
    // =============================
    async function handleLine(line) {
      addHistoryInstant("guest@nocturne:~$ " + line);

      const endpoint = normalizeEndpoint(line);

      if (!endpoint) {
        await addHistoryTyped("[err ] empty input");
        return;
      }

      // Tiny processing beat
      await addHistoryTyped("[dbg ] resolving route...");
      await sleep(BOOT_PAUSE_MS);

      if (isCorrect(endpoint)) {
        lockInput();
        await navigateWithTypedCountdown(endpoint);
      } else {
        await addHistoryTyped("[err ] route rejected");
      }
    }

    function focusInput() {
      if (!inputEl.disabled) inputEl.focus();
    }

    window.addEventListener("load", () => {
      inputEl.disabled = true;
      runBoot();
    });

    window.addEventListener("click", focusInput);

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const line = inputEl.value;
        inputEl.value = "";
        handleLine(line);
      }
    });
  </script>
</body>
</html>
